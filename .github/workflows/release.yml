name: Release

# Tag is the source of truth: pushing `v*` is what creates an immutable release
# tied to a specific commit. There is intentionally no `workflow_dispatch` here —
# if a release run fails, delete the tag, fix, retag.
on:
  push:
    tags:
      - "v*"

# Don't cancel a release mid-flight if a second tag arrives somehow.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # `cargo build` reads the version from `Cargo.toml`, so a tag/Cargo.toml
  # mismatch would silently produce an asset whose name disagrees with the
  # release tag. Fail fast before the build. (build.rs separately enforces
  # Cargo.toml == extension.toml during the build itself.)
  verify-version:
    name: Verify tag matches Cargo.toml
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check version
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version=$(grep -m1 '^version *= *' Cargo.toml | cut -d'"' -f2)
          if [[ "$tag_version" != "$pkg_version" ]]; then
            echo "Tag $GITHUB_REF_NAME implies version $tag_version, but Cargo.toml has $pkg_version" >&2
            exit 1
          fi

  # Release-time invariant: languages/awsum/*.scm are copies of
  # tree-sitter-awsum's queries at the commit pinned in extension.toml (Zed
  # reads queries only from the extension). Between releases a grammar change
  # edits both repos together, so the copies can legitimately run ahead of the
  # pin until the next tree-sitter-awsum release — this check only fires at
  # tag time, when the pin becomes a release artifact. If it fails, delete
  # the tag, run `just sync-queries`, commit, retag.
  query-drift:
    name: Queries match pinned tree-sitter-awsum commit
    needs: verify-version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout awsum-zed
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: awsum-zed

      - name: Read pinned commit
        id: pin
        run: echo "commit=$(sed -n 's/^commit = "\([0-9a-f]*\)"$/\1/p' awsum-zed/extension.toml)" >> "$GITHUB_OUTPUT"

      - name: Checkout tree-sitter-awsum at pinned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: awsum-lang/tree-sitter-awsum
          ref: ${{ steps.pin.outputs.commit }}
          path: tree-sitter-awsum

      - name: Check drift
        run: awsum-zed/scripts/check-queries.sh

  ci:
    needs: verify-version
    uses: ./.github/workflows/ci.yml
    with:
      upload-artifacts: true

  release:
    name: Publish GitHub Release
    needs: [ci, query-drift]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      # Required for `gh release create` to upload assets.
      contents: write
      # Required for `actions/attest-build-provenance` — it mints an OIDC token
      # to identify the workflow to Sigstore, and writes the attestation entry.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download .wasm artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: awsum-zed-*-wasm
          path: dist
          merge-multiple: true

      # Users verify with:
      #   gh attestation verify awsum-zed-X.Y.Z.wasm --repo awsum-lang/awsum-zed
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.wasm

      # The Zed extension registry itself is updated via a manual PR to
      # `zed-industries/extensions` bumping the version + commit pin — there is
      # no API for it. This GitHub Release is for archival + provenance only.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes "See [CHANGELOG.md](./CHANGELOG.md)" \
            dist/*.wasm
