name: CI

on:
  workflow_call:
    inputs:
      upload-artifacts:
        description: "Upload the built .wasm as a workflow artifact (consumed by the release workflow)."
        type: boolean
        default: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
        with:
          toolchain: "1.99.1"
          targets: wasm32-wasip2
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --target wasm32-wasip2 --all-targets -- -D warnings

      # build.rs panics if Cargo.toml and extension.toml disagree on `version`,
      # so the consistency check happens as a side effect of the build.
      - name: Build
        run: cargo build --target wasm32-wasip2 --release

      - name: Read version
        if: inputs.upload-artifacts
        id: version
        run: |
          set -euo pipefail
          version=$(grep -m1 '^version *= *' Cargo.toml | cut -d'"' -f2)
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Stage artifact
        if: inputs.upload-artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/wasm32-wasip2/release/awsum_zed.wasm \
            "dist/awsum-zed-${{ steps.version.outputs.value }}.wasm"

      - name: Upload .wasm artifact
        if: inputs.upload-artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: awsum-zed-${{ steps.version.outputs.value }}-wasm
          path: dist/awsum-zed-${{ steps.version.outputs.value }}.wasm
          if-no-files-found: error
          retention-days: 7
